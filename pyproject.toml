[build-system]
requires = ["setuptools>=77", "wheel", "torch", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "gabor-splatting"
version = "0.1.0"
description = "Differentiable classic and neural Gabor surface splatting with fused CUDA batches"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Inria-Gaussian-Splatting"
license-files = ["LICENSE.md", "NOTICE.md"]
dependencies = ["torch>=2.4"]

[project.urls]
Repository = "https://github.com/luisrodolfo10/diff_gabor_splatting"

[project.optional-dependencies]
dev = ["build", "pytest>=8", "ruff"]
examples = ["pillow>=10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gabor_splatting = ["py.typed", "csrc/*.h", "csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
constraint-dependencies = ["torch==2.8.*"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
gabor-splatting = [{ requirement = "torch", match-runtime = true }]
